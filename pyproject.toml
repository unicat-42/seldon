[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seldon"]

[project]
name = "seldon"
version = "0.1.0"
description = "Селдон: прогноз войн и экономических кризисов, глобально и в постсоветском пространстве"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyreadstat>=1.3.7",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "xlrd>=2.0.2",
]
