[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seldon"]

[project]
name = "seldon"
version = "0.1.0"
description = "Out-of-sample probabilistic forecasting of armed conflicts, currency crises, and systemic banking crises across 174 countries (with a post-Soviet focus) — Селдон: прогноз войн, валютных и банковских кризисов"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Angelina Volina" },
]
keywords = [
    "armed-conflict-prediction",
    "conflict-forecasting",
    "currency-crisis",
    "banking-crisis",
    "financial-crisis",
    "early-warning-system",
    "geopolitical-risk",
    "country-risk",
    "macroeconomics",
    "econometrics",
    "point-in-time",
    "out-of-sample",
    "post-soviet",
    "ucdp",
    "psychohistory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.6",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyreadr>=0.5.9",
    "pyreadstat>=1.3.7",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "xlrd>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/unicat-42/seldon"
Repository = "https://github.com/unicat-42/seldon"
Documentation = "https://github.com/unicat-42/seldon#readme"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
